<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Workforce Management</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main id="app">
    <section id="login-view" class="card login-card">
      <h1>Workforce Management</h1>
      <form id="login-form">
        <label>Username<input name="username" required value="hr@company.com"></label>
        <label>Password<input name="password" type="password" required value="Password@123"></label>
        <button type="submit">Sign in</button>
      </form>
      <p id="login-error" class="error"></p>
    </section>
    <section id="shell" hidden>
      <header><strong>Workforce</strong><span id="role"></span><button id="logout">Logout</button></header>
      <nav id="nav"></nav>
      <section id="content" class="card"></section>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
